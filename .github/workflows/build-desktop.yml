name: Build Desktop (Windows + Linux)

# AndroidForge — Flutter desktop builder.
# Triggered by the Pages UI (or manually) to build a Flutter project's
# desktop targets: Linux x64 and Windows x64. macOS is intentionally
# excluded (the user asked only for Windows + Linux).
#
# Output: GitHub Releases with tag `web-build-output-<run_id>-<platform>`
# containing the bundled binary + assets as a downloadable archive.

on:
  workflow_dispatch:
    inputs:
      zip_path:
        description: "Exact path of the source ZIP in input/ (must be a Flutter project)"
        required: true
        type: string
      target:
        description: "Target platform(s)"
        type: choice
        required: true
        default: "all"
        options:
          - "all"
          - "linux"
          - "windows"

permissions:
  contents: write
  actions: write

env:
  PYTHONUNBUFFERED: "1"
  # Flutter hardcodes the CMake generator to "Visual Studio 16 2019" by
  # default, but the windows-latest runner only has Visual Studio 2022
  # installed. Setting CMAKE_GENERATOR tells Flutter to use VS 2022 instead.
  # See: https://github.com/flutter/flutter/blob/master/packages/flutter_tools/lib/src/windows/build_windows.dart
  CMAKE_GENERATOR: "Visual Studio 17 2022"

jobs:
  # Decide which platforms to build based on the `target` input.
  # The job-level `if:` doesn't support the `matrix` context, so we
  # compute the matrix dynamically here and pass it to the build job.
  decide:
    name: Decide matrix
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set.outputs.matrix }}
      empty: ${{ steps.set.outputs.empty }}
    steps:
      - id: set
        run: |
          target="${{ inputs.target }}"
          case "$target" in
            all)
              echo 'matrix=[{"os":"ubuntu-latest","platform":"linux","archive_ext":"tar.gz"},{"os":"windows-latest","platform":"windows","archive_ext":"zip"}]' >> "$GITHUB_OUTPUT"
              echo "empty=false" >> "$GITHUB_OUTPUT"
              ;;
            linux)
              echo 'matrix=[{"os":"ubuntu-latest","platform":"linux","archive_ext":"tar.gz"}]' >> "$GITHUB_OUTPUT"
              echo "empty=false" >> "$GITHUB_OUTPUT"
              ;;
            windows)
              echo 'matrix=[{"os":"windows-latest","platform":"windows","archive_ext":"zip"}]' >> "$GITHUB_OUTPUT"
              echo "empty=false" >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "empty=true" >> "$GITHUB_OUTPUT"
              echo 'matrix=[]' >> "$GITHUB_OUTPUT"
              ;;
          esac

  build:
    name: Build for ${{ matrix.platform }}
    needs: decide
    if: ${{ needs.decide.outputs.empty != 'true' }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.decide.outputs.matrix) }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: scripts/requirements.txt

      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          pip install -r scripts/requirements.txt

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.27.0"
          channel: "stable"
          cache: true

      - name: Enable Flutter desktop
        run: flutter config --enable-linux-desktop --enable-windows-desktop --enable-macos-desktop

      # The windows-latest runner image (windows-2025-vs2026) ships with
      # Visual Studio 2026, but Flutter hardcodes the CMake generator to
      # "Visual Studio 16 2019" (and doesn't honor CMAKE_GENERATOR in
      # 3.27 either). Install VS 2019 Build Tools + the C++ workload so
      # CMake's "Visual Studio 16 2019" generator finds an actual VS 2019
      # installation. ~5 min install, ~3 GB on disk.
      - name: Install Visual Studio 2019 Build Tools (Windows)
        if: matrix.platform == 'windows'
        shell: cmd
        run: |
          choco install visualstudio2019buildtools --params "--includeRecommended --add Microsoft.VisualStudio.Workload.VCTools" -y --no-progress || exit 0
          choco install visualstudio2019-workload-vctools -y --no-progress || exit 0

      - name: (Linux) Install desktop build deps
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build clang libgtk-3-dev libglib2.0-dev pkg-config libmpv-dev libsecret-1-dev libayatana-appindicator3-dev

      # ---------------------------------------------------------------------
      # Acquire + extract + detect + configure (reuse the Android scripts).
      # All steps that use bash multi-line `\` continuation or other bash
      # syntax MUST declare `shell: bash` so they work on Windows runners
      # (where the default shell is PowerShell and doesn't understand `\`).
      # ---------------------------------------------------------------------
      - name: Acquire source ZIP
        id: acquire
        shell: bash
        run: python scripts/acquire_zip.py --source input-directory --path "${{ inputs.zip_path }}"

      - name: Extract source ZIP
        id: extract
        shell: bash
        run: python scripts/extract_zip.py --zip "${{ steps.acquire.outputs.zip_path }}"

      - name: Detect project
        shell: bash
        run: |
          python scripts/detect_project.py --root "${{ steps.extract.outputs.project_root }}" --output detection.json
          echo "::group::Detection JSON"
          cat detection.json
          echo "::endgroup::"

      - name: Configure toolchain (writes toolchain.json)
        shell: bash
        run: |
          python scripts/setup_environment.py \
            --root "${{ steps.extract.outputs.project_root }}" \
            --detect detection.json \
            --output toolchain.json
          echo "::group::Toolchain JSON"
          cat toolchain.json
          echo "::endgroup::"

      # ---------------------------------------------------------------------
      # Build
      # ---------------------------------------------------------------------
      - name: flutter pub get
        working-directory: ${{ steps.extract.outputs.project_root }}
        shell: bash
        run: flutter pub get

      # Replace Flutter's symlinks in .plugin_symlinks/ with Windows
      # junctions (mklink /J). Junctions are Windows-native and don't
      # have the "Cannot extract through symlink" issue that CMake's tar
      # has with regular Windows symlinks. This is needed because the
      # media_kit_libs_windows_audio plugin's CMakeLists.txt extracts a
      # pre-built binary archive through .plugin_symlinks/ paths.
      - name: Replace symlinks with junctions (Windows)
        if: matrix.platform == 'windows'
        working-directory: ${{ steps.extract.outputs.project_root }}
        shell: pwsh
        run: |
          $symlinkDir = "windows\flutter\ephemeral\.plugin_symlinks"
          if (Test-Path $symlinkDir) {
            Get-ChildItem $symlinkDir | ForEach-Object {
              $linkPath = $_.FullName
              if ((Get-Item $linkPath -Force).Attributes -band [System.IO.FileAttributes]::ReparsePoint) {
                $target = (Get-Item $linkPath -Force).Target
                if (-not $target) {
                  $target = (Get-Item $linkPath -Force).LinkTarget
                }
                if ($target) {
                  Write-Host "Replacing symlink $linkPath -> $target with junction"
                  Remove-Item -Force -Recurse $linkPath
                  cmd /c mklink /J "$linkPath" "$target" | Out-Null
                }
              }
            }
          }

      - name: Build (Linux)
        if: matrix.platform == 'linux'
        working-directory: ${{ steps.extract.outputs.project_root }}
        shell: bash
        run: flutter build linux --release

      - name: Build (Windows)
        if: matrix.platform == 'windows'
        working-directory: ${{ steps.extract.outputs.project_root }}
        shell: cmd
        run: |
          rmdir /s /q build\windows 2>nul
          flutter build windows --release

      # ---------------------------------------------------------------------
      # Package the build output (bundle folder) into a single archive
      # ---------------------------------------------------------------------
      - name: Package (Linux)
        if: matrix.platform == 'linux'
        shell: bash
        run: |
          PROJECT_ROOT="${{ steps.extract.outputs.project_root }}"
          # Flutter Linux output path: build/linux/x64/release/bundle/
          BUNDLE_DIR="$PROJECT_ROOT/build/linux/x64/release/bundle"
          if [ ! -d "$BUNDLE_DIR" ]; then
            echo "ERROR: bundle dir not found at $BUNDLE_DIR"
            echo "Listing build/linux/ contents:"
            find "$PROJECT_ROOT/build/linux" -maxdepth 4 -type d 2>/dev/null || true
            exit 1
          fi
          echo "Bundle contents:"
          ls -la "$BUNDLE_DIR"
          cd "$BUNDLE_DIR"
          OUT="$GITHUB_WORKSPACE/harmonymusic-linux-x64.tar.gz"
          tar -czf "$OUT" *
          ls -la "$OUT"

      - name: Package (Windows)
        if: matrix.platform == 'windows'
        shell: bash
        run: |
          PROJECT_ROOT="${{ steps.extract.outputs.project_root }}"
          # Flutter Windows output path: build/windows/x64/runner/Release/
          BUNDLE_DIR="$PROJECT_ROOT/build/windows/x64/runner/Release"
          if [ ! -d "$BUNDLE_DIR" ]; then
            echo "ERROR: bundle dir not found at $BUNDLE_DIR"
            echo "Listing build/windows/ contents:"
            find "$PROJECT_ROOT/build/windows" -maxdepth 5 -type d 2>/dev/null || true
            exit 1
          fi
          echo "Bundle contents:"
          ls -la "$BUNDLE_DIR"
          cd "$BUNDLE_DIR"
          OUT="$GITHUB_WORKSPACE/harmonymusic-windows-x64.zip"
          7z a -tzip "$OUT" *
          ls -la "$OUT"

      # ---------------------------------------------------------------------
      # Publish to a release tagged web-build-output-<run_id>-<platform>
      # (so the Pages UI can find it predictably)
      # ---------------------------------------------------------------------
      - name: Publish to release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          TAG="web-build-output-${{ github.run_id }}-${{ matrix.platform }}"
          ASSET="$GITHUB_WORKSPACE/harmonymusic-${{ matrix.platform }}-x64.${{ matrix.archive_ext }}"
          echo "Creating release $TAG…"
          gh release create "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --target main \
            --title "Desktop build #${{ github.run_number }} (${{ matrix.platform }})" \
            --notes "Auto-generated by AndroidForge desktop workflow run ${{ github.run_id }}." \
            --prerelease || true
          echo "Uploading $ASSET…"
          gh release upload "$TAG" "$ASSET" --clobber --repo "$GITHUB_REPOSITORY"
          echo "## 📦 Desktop build (${{ matrix.platform }})" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Tag: \`$TAG\`" >> "$GITHUB_STEP_SUMMARY"
          echo "URL: https://github.com/$GITHUB_REPOSITORY/releases/tag/$TAG" >> "$GITHUB_STEP_SUMMARY"
          echo "Asset: \`harmonymusic-${{ matrix.platform }}-x64.${{ matrix.archive_ext }}\`" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload build logs (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: AndroidForge-desktop-logs-${{ matrix.platform }}
          path: |
            ${{ steps.extract.outputs.project_root }}/build/
            .androidforge/logs/
          if-no-files-found: ignore
          retention-days: 14
